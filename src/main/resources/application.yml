# ============================================
# Stylelens 应用主配置文件
# ============================================

# 激活的环境配置文件（dev: 开发, test: 测试, prod: 生产）
spring:
  profiles:
    active: dev
  
  # 应用基础配置
  application:
    name: stylelens-api
  
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    max-threads: 200
    min-spare-threads: 20
    connection-timeout: 20000

# ============================================
# Spring AI Alibaba 配置
# ============================================
spring.ai.dashscope:
  # 百炼平台API密钥，请替换为您的实际API Key
  api-key: ${api_key}
  # 模型名称，可选：qwen-turbo, qwen-plus, qwen-max, wanx-v1 等
  chat:
    options:
      model: ${model_name}
      temperature: 0.7
      top-p: 0.8
    # 请求超时配置（毫秒）
    timeout: 30000
  # 图片生成配置
  image:
    options:
      model: wanx-v1
    timeout: 60000
  # 连接配置
  base-url: https://dashscope.aliyuncs.com
  # 重试配置
  retry:
    max-attempts: 3
    backoff:
      initial-interval: 1000
      multiplier: 2.0
      max-interval: 5000

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.stylelens.www.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    root: INFO
    com.stylelens.www: DEBUG
    com.alibaba.cloud.ai: DEBUG
    org.springframework.ai: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/stylelens.log
    max-size: 10MB
    max-history: 30

# 应用自定义配置
app:
  # 分页默认配置
  page:
    default-size: 10
    max-size: 100
  # AI配置
  ai:
    # 系统提示词
    system-prompt: "你是一个博学的智能聊天助手，请根据用户提问回答！"
    # 最大token数
    max-tokens: 2000
