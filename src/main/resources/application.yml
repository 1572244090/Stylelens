# ============================================
# Stylelens 应用主配置文件
# ============================================

# 激活的环境配置文件（dev: 开发, test: 测试, prod: 生产）
spring:
  profiles:
    active: dev
  
  # 应用基础配置
  application:
    name: stylelens-api
  
  # 文件上传配置
  servlet:
    multipart:
      # 单个文件最大大小，图片上传建议 10MB
      max-file-size: 10MB
      # 单次请求最大大小
      max-request-size: 10MB

# 服务器配置
server:
  # 服务端口
  port: 8080
  servlet:
    # API 上下文路径，所有接口前缀为 /api
    context-path: /api
  tomcat:
    # 最大工作线程数
    max-threads: 200
    # 最小空闲线程数
    min-spare-threads: 20
    # 连接超时时间（毫秒）
    connection-timeout: 20000

# ============================================
# Spring AI Alibaba 配置
# ============================================
# 基于通义千问大模型的 AI 服务配置
# 官方文档：https://help.aliyun.com/zh/model-studio/
spring.ai.dashscope:
  # 百炼平台 API 密钥，请替换为您的实际 API Key
  # 获取地址：https://dashscope.console.aliyun.com/
  # 生产环境建议使用环境变量或配置中心管理
  api-key: sk-6738d08ac98346b2b093462545c0059d
  
  # 文本对话配置（用于普通聊天、文本生成）
  chat:
    options:
      # 模型名称，可选值：
      # - qwen-turbo: 速度快，成本低，适合简单任务
      # - qwen-plus: 性能均衡，适合大多数场景
      # - qwen-max: 性能最强，适合复杂推理
      # - qwen3.5-122b-a10b: Qwen3.5 开源系列模型
      model: qwen3.5-122b-a10b
      # 温度参数，控制输出随机性（0.0-2.0）
      # 值越低输出越确定，值越高输出越多样
      temperature: 0.7
      # 核采样参数，控制输出多样性（0.0-1.0）
      # 值越小，模型会更保守地选择高概率词
      top-p: 0.8
    # 请求超时配置（毫秒），文本对话一般 30 秒足够
    timeout: 30000
  
  # 视觉模型配置（用于图片理解、多模态分析）
  # 官方文档：https://help.aliyun.com/zh/model-studio/vision
  vision:
    options:
      # 视觉模型名称，可选值：
      # - qwen-vl-max: 性能最强，支持复杂图像理解（推荐用于图片分析）
      # - qwen-vl-plus: 性能均衡，性价比高
      # - qwen-vl-flash: 速度快，成本低
      # 注意：Omni 模型（如 qwen3.5-omni-plus）默认输出音频，非流式模式需额外配置
      model: qwen-vl-max
      # 视觉分析温度参数，设置为较低值以获得更稳定的分析结果
      temperature: 0.1
      # 多模态开关，必须设置为 true
      # 设置为 true 后请求会路由到多模态端点
      # 设置为 false 会路由到文本端点，导致图片识别失败
      multi-model: true
    # 请求超时配置（毫秒），视觉模型处理时间较长，建议设置更长的超时时间
    timeout: 60000
  
  # 图片生成配置（用于文生图）
  image:
    options:
      # 图片生成模型，可选值：
      # - wanx-v1: 通义万相 v1
      # - wanx-v2: 通义万相 v2
      # - qwen-image-2.0-pro: 通义千问图像 2.0 Pro（推荐）
      model: qwen-image-2.0-pro
    # 图片生成超时配置（毫秒），生成图片通常需要较长时间
    timeout: 60000
  
  # 百炼平台服务端点 URL
  # 不同地域的 URL 可能不同，请根据实际情况修改
  base-url: https://dashscope.aliyuncs.com
  
  # 请求重试配置
  # 用于处理网络波动、服务限流等临时性问题
  retry:
    # 最大重试次数
    max-attempts: 3
    backoff:
      # 初始重试间隔（毫秒）
      initial-interval: 1000
      # 重试间隔倍数，每次重试间隔 = 上次间隔 * multiplier
      multiplier: 2.0
      # 最大重试间隔（毫秒）
      max-interval: 5000

# MyBatis-Plus 配置
mybatis-plus:
  # Mapper XML 文件位置
  mapper-locations: classpath:mapper/*.xml
  # 实体类包路径
  type-aliases-package: com.stylelens.www.entity
  configuration:
    # 开启下划线转驼峰映射
    map-underscore-to-camel-case: true
    # 关闭二级缓存
    cache-enabled: false
    # 日志实现，开发环境使用标准输出便于调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键生成策略，auto 表示数据库自增
      id-type: auto
      # 逻辑删除字段名
      logic-delete-field: deleted
      # 逻辑删除值
      logic-delete-value: 1
      # 逻辑未删除值
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    # 根日志级别
    root: INFO
    # 项目代码日志级别，开发环境设置为 DEBUG 便于调试
    com.stylelens.www: DEBUG
    # Spring AI Alibaba 日志级别，设置为 DEBUG 可查看 AI 请求详情
    com.alibaba.cloud.ai: DEBUG
    # Spring AI 框架日志级别
    org.springframework.ai: DEBUG
  pattern:
    # 控制台日志格式
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    # 文件日志格式
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    # 日志文件路径
    name: logs/stylelens.log
    # 单个日志文件最大大小
    max-size: 10MB
    # 日志文件保留天数
    max-history: 30

# 应用自定义配置
app:
  # 分页默认配置
  page:
    # 默认每页大小
    default-size: 10
    # 最大每页大小
    max-size: 100
  # AI 配置
  ai:
    # 系统提示词
    system-prompt: "你是一个博学的智能聊天助手，请根据用户提问回答！"
    # 最大 token 数
    max-tokens: 2000
